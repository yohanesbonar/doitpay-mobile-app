name: Build Android

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub Environment name (e.g. staging, production)"
        required: true
        type: string
      apk_path:
        description: "Path to the built APK (e.g. android/app/build/outputs/apk/staging/release/app-staging-release.apk)"
        required: true
        type: string
      build_command:
        description: "Command to build the APK (e.g. yarn build:android-staging)"
        required: true
        type: string
      env_file_name:
        description: "Name of the environment file to create (e.g. .env.staging)"
        required: true
        type: string
      env_file_content:
        description: "Full content of the environment file (multiline string)"
        required: true
        type: string
      runs_on:
        description: "Runner label"
        required: false
        type: string
        default: "ubuntu-latest"

concurrency:
  group: android-${{ inputs.environment }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "24"
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  CMDLINE_TOOLS_VERSION: "15859902"
  ANDROID_PLATFORM: "platforms;android-36"
  ANDROID_BUILD_TOOLS: "build-tools;36.0.0"
  FIREBASE_TOOLS_VERSION: "15.25.1"
  FIREBASE_APP_ID: "1:302181848541:android:e3980c6c0c215e4a3fd234"
  FIREBASE_GROUPS: "tech-&-pm"

jobs:
  build:
    name: Build APK ${{ inputs.environment }}
    runs-on: ${{ inputs.runs_on }}
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: ${{ env.CMDLINE_TOOLS_VERSION }}

      - name: Install Android SDK Packages
        run: |
          sdkmanager \
            "${{ env.ANDROID_PLATFORM }}" \
            "${{ env.ANDROID_BUILD_TOOLS }}"
          yes | sdkmanager --licenses

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Create Environment File
        shell: bash
        run: |
          cat > "${{ inputs.env_file_name }}" <<'EOF'
          ${{ inputs.env_file_content }}
          POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}
          EOF
          chmod 600 "${{ inputs.env_file_name }}"

      - name: Build APK
        run: ${{ inputs.build_command }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}

      - name: Get Commit Message
        id: commit
        run: |
          echo "message<<EOF" >> "$GITHUB_OUTPUT"
          git log -1 --pretty=%B >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GCP Service Account
        shell: bash
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}' > firebase.json

      - name: Upload APK to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: firebase.json
        run: |
          firebase appdistribution:distribute \
            "${{ inputs.apk_path }}" \
            --app "${{ env.FIREBASE_APP_ID }}" \
            --groups "${{ env.FIREBASE_GROUPS }}" \
            --release-notes "[${{ inputs.environment }}]
          Build: #${{ github.run_number }}
          Branch: ${{ github.ref_name }}
          Triggered by: @${{ github.actor }}
          Commit: ${{ github.sha }}
          Message:
          ${{ steps.commit.outputs.message }}
          Workflow:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          "

      - name: Cleanup Workspace
        if: always()
        shell: bash
        run: |
          rm -f "${{ inputs.env_file_name }}"
          rm -rf \
            android/app/build \
            android/build
          rm -rf firebase.json
