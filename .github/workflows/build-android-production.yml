name: Build Android (Production)

on:
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-android.yml
    with:
      environment: production
      runs-on: arc-runner-production
      apk_path: android/app/build/outputs/apk/production/release/app-production-release.apk
      build_command: yarn build:android-production
      env_file_name: .env.production
      env_file_content: |
        API_URL=https://mobi.doitpay.co
        APP_NAME=DoitPay-Production
        ENABLE_NETWORK_LOGGER=false
        POSTHOG_HOST=https://us.i.posthog.com
        POSTHOG_RELEASE_STAGE=public_release
    secrets: inherit
