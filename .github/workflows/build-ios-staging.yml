name: Build iOS (Staging)
run-name: Build iOS (Staging / Firebase / ${{ inputs.api_url }})

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Select upload destination"
        required: true
        type: choice
        options:
          - firebase
      api_url:
        description: "API URL"
        required: true
        type: choice
        default: https://mobi.doitpay.dev
        options:
          - https://mobi.doitpay.dev
          - https://mobi-staging-2.doitpay.dev

jobs:
  build:
    uses: ./.github/workflows/build-ios.yml
    with:
      environment: staging
      api_url: ${{ inputs.api_url }}
      xcode_scheme: Doitpay-Staging
      env_file_name: .env.staging
      env_file_content: |
        API_URL=${{ inputs.api_url }}
        APP_NAME=DoitPay-Staging
        ENABLE_NETWORK_LOGGER=true
        POSTHOG_HOST=https://us.i.posthog.com
        POSTHOG_RELEASE_STAGE=internal_release
      upload_testflight: false
      upload_firebase: ${{ inputs.upload == 'firebase' }}
    secrets: inherit
