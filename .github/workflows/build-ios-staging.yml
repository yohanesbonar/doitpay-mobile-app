name: Build iOS (Staging)

on:
  workflow_dispatch:
    inputs:
      upload_firebase:
        description: "Upload IPA to Firebase App Distribution"
        required: true
        type: boolean
        default: true

jobs:
  build:
    uses: ./.github/workflows/build-ios.yml
    with:
      environment: staging
      xcode_scheme: Doitpay-Staging
      env_file_name: .env.staging
      env_file_content: |
        API_URL=https://mobi.doitpay.dev
        APP_NAME=DoitPay-Staging
        ENABLE_NETWORK_LOGGER=true
        POSTHOG_HOST=https://us.i.posthog.com
        POSTHOG_RELEASE_STAGE=internal_release
      upload_testflight: false
      upload_firebase: ${{ inputs.upload_firebase }}
    secrets: inherit
