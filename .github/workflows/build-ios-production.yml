name: Build iOS (Production)

on:
  workflow_dispatch:
    inputs:
      upload_firebase:
        description: "Upload IPA to Firebase App Distribution"
        required: true
        type: boolean
        default: true
      upload_testflight:
        description: "Upload IPA to TestFlight"
        required: true
        type: boolean
        default: false

jobs:
  build:
    uses: ./.github/workflows/build-ios.yml
    with:
      environment: production
      xcode_scheme: Doitpay-Production
      env_file_name: .env.production
      env_file_content: |
        API_URL=https://mobi.doitpay.co
        APP_NAME=DoitPay-Production
        ENABLE_NETWORK_LOGGER=false
        POSTHOG_HOST=https://us.i.posthog.com
        POSTHOG_RELEASE_STAGE=public_release
      upload_firebase: ${{ inputs.upload_firebase }}
      upload_testflight: ${{ inputs.upload_testflight }}
    secrets: inherit
