name: Build Android Bundle (Production)

on:
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-android.yml
    with:
      environment: production
      runs_on: arc-runner-mobile-app-production
      apk_path: android/app/build/outputs/bundle/productionRelease/app-production-release.aab
      build_command: yarn build-bundle:android-production:clean
      env_file_name: .env.production
      env_file_content: |
        API_URL=https://mobi.doitpay.co
        APP_NAME=DoitPay-Production
        ENABLE_NETWORK_LOGGER=false
        POSTHOG_HOST=https://us.i.posthog.com
        POSTHOG_RELEASE_STAGE=public_release
    secrets: inherit


concurrency:
  group: android-bundle-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "24"
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  CMDLINE_TOOLS_VERSION: "15859902"
  ANDROID_PLATFORM: "platforms;android-36"
  ANDROID_BUILD_TOOLS: "build-tools;36.0.0"

jobs:
  build:
    name: Build AAB Production
    runs-on: arc-runner-mobile-app-production
    environment: production
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Get commit info
        id: commit
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            git log -1 --pretty=%B
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Discord - Started
        uses: tsickert/discord-webhook@v7.0.0
        with:
          username: GitHub
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          embed-title: "🚀 Building Android Bundle (AAB) Started"
          embed-color: 3447003
          embed-url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          embed-description: |
            **Environment:** production
            **Branch:** `${{ github.ref_name }}`
            **Actor:** ${{ github.actor }}
            **Commit:** `${{ steps.commit.outputs.sha }}`
            **Commit Message:**
            ```
            ${{ steps.commit.outputs.subject }}
            ```
          embed-footer-text: "${{ github.repository }}"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: ${{ env.CMDLINE_TOOLS_VERSION }}

      - name: Install Android SDK Packages
        run: |
          sdkmanager \
            "${{ env.ANDROID_PLATFORM }}" \
            "${{ env.ANDROID_BUILD_TOOLS }}"
          yes | sdkmanager --licenses

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Setup Keystore
        shell: bash
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/doitpay-release.keystore
          chmod 600 android/app/doitpay-release.keystore

      - name: Create Environment File
        shell: bash
        run: |
          cat > .env.production <<'EOF'
          API_URL=https://mobi.doitpay.co
          APP_NAME=DoitPay-Production
          ENABLE_NETWORK_LOGGER=false
          POSTHOG_HOST=https://us.i.posthog.com
          POSTHOG_RELEASE_STAGE=public_release
          POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}
          EOF
          chmod 600 .env.production

      - name: Build Bundle
        env:
          MYAPP_RELEASE_STORE_FILE: doitpay-release.keystore
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.MYAPP_RELEASE_STORE_PASSWORD }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.MYAPP_RELEASE_KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.MYAPP_RELEASE_KEY_PASSWORD }}
        run: yarn build-bundle:android-production:clean

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-production-release-${{ steps.commit.outputs.sha }}.aab
          path: android/app/build/outputs/bundle/productionRelease/app-production-release.aab
          retention-days: 7

      - name: Cleanup Workspace
        if: always()
        shell: bash
        run: |
          rm -f .env.production
          rm -f android/app/doitpay-release.keystore
          rm -rf \
            android/app/build \
            android/build

      - name: Notify Success
        if: success()
        uses: tsickert/discord-webhook@v7.0.0
        with:
          username: GitHub
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          embed-title: "✅ Android Bundle (AAB) Ready"
          embed-color: 3066993
          embed-url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          embed-description: |
            **Environment:** production
            **Branch:** `${{ github.ref_name }}`
            **Actor:** ${{ github.actor }}
            **Commit:** `${{ steps.commit.outputs.sha }}`
            **Commit Message:**
            ```
            ${{ steps.commit.outputs.subject }}
            ```
            **Artifact:** `app-production-release-${{ steps.commit.outputs.sha }}.aab` (available for 7 days)
          embed-footer-text: "${{ github.repository }}"

      - name: Notify Failure
        if: failure()
        uses: tsickert/discord-webhook@v7.0.0
        with:
          username: GitHub
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          embed-title: "❌ Android Bundle (AAB) Failed"
          embed-color: 15158332
          embed-url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          embed-description: |
            **Environment:** production
            **Branch:** `${{ github.ref_name }}`
            **Actor:** ${{ github.actor }}
            **Commit:** `${{ steps.commit.outputs.sha }}`
            **Commit Message:**
            ```
            ${{ steps.commit.outputs.subject }}
            ```
          embed-footer-text: "${{ github.repository }}"
